<svg viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kmp-app-template">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="55%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#3DDC84"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="168" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <text x="450" y="62" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#wordmark)">
    kmp-app-template
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0s" fill="freeze"/>
  </text>

  <!-- root-nav flow motif: Splash -> Login -> Home lighting in sequence, confined to y=100..108,
       clear of the title (bottom ~72) and tagline (top ~145) -->
  <line x1="250" y1="104" x2="650" y2="104" stroke="#30363d" stroke-width="2"/>
  <circle cx="250" cy="104" r="6" fill="#7F52FF"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="104" r="6" fill="#4285F4"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="104" r="6" fill="#3DDC84"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>

  <!-- traveling nav signal -->
  <circle r="3.5" fill="#ffffff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 250 104 L 650 104"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="250" y="126" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8b95a5">SPLASH</text>
  <text x="450" y="126" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8b95a5">LOGIN</text>
  <text x="650" y="126" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8b95a5">HOME</text>

  <text x="450" y="152" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#94a3b8">KOTLIN MULTIPLATFORM &#183; COMPOSE &#183; ANDROID + DESKTOP</text>
</svg>
