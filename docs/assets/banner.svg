<svg viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kat-title kat-desc">
  <title id="kat-title">kmp-app-template</title>
  <desc id="kat-desc">A minimal buildable Kotlin Multiplatform app template — a Splash, Login and Home scaffold wired end to end.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="55%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#3DDC84"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="168" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <text x="450" y="62" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#wordmark)">
    kmp-app-template
  </text>

  <!-- root-nav scaffold: Splash -> Login -> Home -->
  <line id="kat-rail" x1="250" y1="104" x2="650" y2="104" stroke="#30363d" stroke-width="2"/>
  <g id="kat-dots">
    <circle cx="250" cy="104" r="6" fill="#7F52FF"/>
    <circle cx="450" cy="104" r="6" fill="#4285F4"/>
    <circle cx="650" cy="104" r="6" fill="#3DDC84"/>
  </g>

  <text x="250" y="126" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8b95a5">SPLASH</text>
  <text x="450" y="126" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8b95a5">LOGIN</text>
  <text x="650" y="126" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8b95a5">HOME</text>

  <text x="450" y="152" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#94a3b8">KOTLIN MULTIPLATFORM &#183; COMPOSE &#183; ANDROID + DESKTOP</text>
</svg>
