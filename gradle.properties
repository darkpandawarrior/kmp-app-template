org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.incremental=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
# cmp-shared wires composeMain/composeIosMain by hand (Compose Multiplatform doesn't
# publish iosX64/watchOS artifacts, so the default ios/watchos hierarchy groups don't fit).
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Renamed in bulk by customizer.sh; defaults keep the template building as-is.
fork.project.name=kmp-app-template
