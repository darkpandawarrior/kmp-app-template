name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS: the iOS/watchOS targets in cmp-shared need Xcode toolchains a Linux runner doesn't have.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: AI wiring check (docs/ai-wiring.md)
        run: |
          scripts/test-check-ai-wiring.sh
          scripts/check-ai-wiring.sh

      # The README's version badges are generated from gradle/libs.versions.toml and the Gradle
      # wrapper, not typed. A generator with no gate is worse than hand-written prose, because the
      # marker comment tells every future reader the block is trustworthy — so verify, here, before
      # the expensive step.
      - name: README version badges are current
        run: |
          ./scripts/gen-readme.sh
          git diff --exit-code -- README.md \
            || { echo "::error::README badges are stale. Run ./scripts/gen-readme.sh and commit."; exit 1; }

      - name: Gradle
        run: ./gradlew assemble check
