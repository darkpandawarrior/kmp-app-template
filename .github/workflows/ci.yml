name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS: the iOS/watchOS targets in cmp-shared need Xcode toolchains a Linux runner doesn't have.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-

      - name: AI wiring check (docs/ai-wiring.md)
        run: |
          scripts/test-check-ai-wiring.sh
          scripts/check-ai-wiring.sh

      # The README's version badges are generated from gradle/libs.versions.toml and the Gradle
      # wrapper, not typed. A generator with no gate is worse than hand-written prose, because the
      # marker comment tells every future reader the block is trustworthy — so verify, here, before
      # the expensive step.
      - name: README version badges are current
        run: |
          ./scripts/gen-readme.sh
          git diff --exit-code -- README.md \
            || { echo "::error::README badges are stale. Run ./scripts/gen-readme.sh and commit."; exit 1; }

      - name: Gradle
        run: ./gradlew assemble check
