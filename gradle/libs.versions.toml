[versions]
agp = "9.5.0-alpha06"
kotlin = "2.4.20"
compose-multiplatform = "1.13.0-alpha01"
androidx-activity = "1.14.0-alpha02"
coroutines = "1.11.0"
koin = "4.2.2"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
# Code quality. Same pins as the rest of the family (PaymentsLab, HireSignal, Ghar, Mileway).
detekt = "2.0.0-alpha.6"
ktlint-plugin = "14.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Same version kmp-toolkit's own catalog pins (external/kmp-toolkit/gradle/libs.versions.toml) —
# the AI seam's `aiModule()` DI wiring, not published by :ai/:llm-chat as an `api` dependency.
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
